# Kiln's defaults. Installations configure Kiln in kiln.yaml (KILN_CONFIG names another file), and
# every setting can be overridden from the environment: kiln.database.url is KILN_DATABASE_URL.
spring:
  application:
    name: kiln
  config:
    import: "optional:file:${KILN_CONFIG:/etc/kiln/kiln.yaml}"
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  shutdown: graceful

# Health and metrics are for the infrastructure only, on their own port that no ingress exposes,
# at Spring Boot Actuator's own paths: /actuator/health (with /liveness and /readiness) and
# /actuator/prometheus.
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        # On outside Kubernetes too, so every deployment has the liveness and readiness groups.
        enabled: true

kiln:
  web:
    # Where clients reach Kiln; set it in kiln.yaml to the installation's own URL.
    external-url: http://localhost:8080
  storage:
    type: fs
    fs:
      root: /var/lib/kiln/blobs
